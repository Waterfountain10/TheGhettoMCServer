# Raspberry Pi 4B 2 GB; keep dashboard off this constrained host.
services:
  minecraft:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    stdin_open: true
    tty: true
    stop_grace_period: 90s
    ports:
      - "25565:25565/tcp"
      - "19132:19132/tcp"
      - "19132:19132/udp"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MC_VERSION:-26.3}"
      MEMORY: "${MC_MEMORY:-1152M}"
      INIT_MEMORY: "256M"
      MOTD: "mc.kiem.net | Java + Bedrock"
      MAX_PLAYERS: "3"
      ONLINE_MODE: "TRUE"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD:?Run bash scripts/bootstrap.sh first}"
      DIFFICULTY: "normal"
      MODE: "survival"
      VIEW_DISTANCE: "5"
      SIMULATION_DISTANCE: "4"
      SPAWN_PROTECTION: "0"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
    volumes:
      - ./data:/data
      ENTITY_BROADCAST_RANGE_PERCENTAGE: "75"
      NETWORK_COMPRESSION_THRESHOLD: "256"
    mem_limit: 1600m
